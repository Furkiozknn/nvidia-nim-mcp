# PyPI yayini -- Trusted Publishing (OIDC).
#
# Bu is akisinda API ANAHTARI YOKTUR ve olmamalidir. PyPI, GitHub'in
# imzaladigi kisa omurlu bir OIDC jetonuna guvenir; depoda saklanan,
# sizabilecek bir sir yok. Tek sartlari: `id-token: write` izni ve
# PyPI tarafinda bu depo/is akisi icin tanimlanmis bir yayinci.
#
# Ilk kullanimdan ONCE PyPI'da bir kez yapilacak (tarayicidan):
#   pypi.org -> Your projects -> Publishing -> Add a new pending publisher
#     Owner:            Furkiozknn
#     Repository:       nvidia-nim-mcp
#     Workflow name:    yayinla.yml
#     Environment name: pypi
#
# Sonrasinda yayin (etiket pyproject surumuyla ayni olmali, orn. 0.1.0 -> v0.1.0):
#   git tag -a v0.1.0 <sha> -m "v0.1.0" && git push origin v0.1.0
#
# Kayit tamamlanmadan once: Actions -> Yayinla -> Run workflow (kutuyu
# isaretleme). `paketle` isi kosar, `uv build` + `twine check` gecerse
# paketlemede sorun yok demektir; hicbir sey yayimlanmaz.

name: Yayinla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      yayinla:
        description: "PyPI'a gercekten gonder (varsayilan: yalniz paketle ve dogrula)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yayinla-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paketle:
    name: Paketle ve dogrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Etiket ile surum ayni mi
        run: |
          etiket="${GITHUB_REF_NAME#v}"
          surum="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "etiket=$etiket  pyproject=$surum"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$etiket" != "$surum" ]; then
            echo "::error::Etiket ($etiket) ile pyproject surumu ($surum) uyusmuyor."
            exit 1
          fi


      - name: server.json pyproject ile ayni seyi soyluyor mu
        run: |
          set -eu
          python3 - <<'PY'
          import json, re, sys
          meta = open("pyproject.toml", encoding="utf-8").read()
          dist = re.search(r'^name = "([^"]+)"', meta, re.M).group(1)
          surum = re.search(r'^version = "([^"]+)"', meta, re.M).group(1)
          d = json.load(open("server.json", encoding="utf-8"))
          hatalar = []
          if d["name"] != "io.github.Furkiozknn/nvidia-nim-mcp":
              hatalar.append(f'server.json adi {d["name"]}, beklenen io.github.Furkiozknn/nvidia-nim-mcp')
          if d["version"] != surum:
              hatalar.append(f'server.json surumu {d["version"]}, pyproject {surum}')
          for p in d.get("packages", []):
              if p.get("registryType") == "pypi" and p.get("identifier") != dist:
                  hatalar.append(f'paket kimligi {p.get("identifier")}, pyproject {dist}')
          readme = open("README.md", encoding="utf-8").read()
          if "mcp-name: io.github.Furkiozknn/nvidia-nim-mcp" not in readme:
              hatalar.append("README'de mcp-name isareti yok; PyPI sahiplik dogrulamasi buna bakiyor")
          if hatalar:
              print("::error::" + "; ".join(hatalar))
              sys.exit(1)
          print("server.json, pyproject ve README ayni seyi soyluyor")
          PY

      - run: uv build

      - name: twine check
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  yayinla:
    name: PyPI'a gonder
    needs: paketle
    # Etiketle gelen push yayimlar. Elle tetikleme, kutu isaretlenmedikce
    # yalniz `paketle` isini kosar: Trusted Publishing tanimli olmadan
    # yayin adimini denemek kirmizi bir kosudan baska bir sey uretmez,
    # oysa paketlemenin CI'da calistigini gormek gerekli.
    if: github.event_name == 'push' || inputs.yayinla
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nvidia-nim-mcp
    permissions:
      id-token: write   # Trusted Publishing icin ZORUNLU
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  kayit:
    name: MCP Registry
    needs: yayinla
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: server.json surumunu etiketle esitle
        run: |
          set -eu
          surum="${GITHUB_REF_NAME#v}"
          python3 - "$surum" <<'PY'
          import json, sys
          v = sys.argv[1]
          d = json.load(open("server.json", encoding="utf-8"))
          d["version"] = v
          for p in d.get("packages", []):
              p["version"] = v
          json.dump(d, open("server.json", "w", encoding="utf-8"), indent=2)
          print("server.json ->", v)
          PY

      - name: mcp-publisher indir
        run: |
          set -eu
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      # OIDC: depoda saklanan bir sir yok, GitHub'in imzaladigi kisa omurlu
      # jeton yeter. Ad alani io.github.<kullanici> ile eslesmek zorunda.
      - name: MCP Registry'ye giris
        run: ./mcp-publisher login github-oidc

      - name: Yayinla
        run: ./mcp-publisher publish
