name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 19 sn
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range declared in pyproject.toml's requires-python.
        # Testing the floor is the point: it was never exercised before, which
        # is how an unjustified ">=3.14" pin survived unnoticed.
        python-version: ["3.11", "3.14"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date with pyproject.toml instead
      # of silently re-resolving. It had drifted (the lock still named the
      # project "nvidia-nim"), which plain `uv sync` hid.
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  # `yayinla.yml` yalniz `v*` etiketinde kosuyor, yani paketleme bozulursa
  # bunu ancak yayinlamaya calistigin an ogrenirsin. Kardes depo mcp-vet'te
  # tam olarak bu oldu: 244 test yesilken `uv build` calismiyordu, cunku
  # hicbir sey paketlemeyi denemiyordu. Bu is onu her push'a tasiyor.
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 19 sn
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Paket derleniyor mu
        run: uv build

      - name: Uretilen paket gecerli mi
        run: uvx twine check dist/*

      # Derlemenin basarili olmasi paketin icinde dogru dosyalarin oldugunu
      # kanitlamaz: eksik bir modul ya da yanlis bir giris noktasi ancak
      # kurulunca ortaya cikar.
      - name: Tekerlek kuruluyor ve giris noktasi yerinde
        run: |
          set -e
          uv venv /tmp/deneme
          VIRTUAL_ENV=/tmp/deneme uv pip install dist/*.whl
          test -x /tmp/deneme/bin/nvidia-nim-mcp || { echo "konsol komutu uretilmedi: nvidia-nim-mcp"; exit 1; }
          # Sunucu stdio'da sonsuza kadar bloke oldugu icin CALISTIRILMIYOR;
          # hedefin var ve cagrilabilir oldugu dogrulaniyor.
          VIRTUAL_ENV=/tmp/deneme /tmp/deneme/bin/python -c "import nvidia_image as m; assert callable(m.main), 'main cagrilabilir degil'"
          echo "nvidia-nim-mcp kuruldu, giris noktasi cagrilabilir"

  denetim:
    name: mcp-vet (kendi sunucumuza kendi aracimiz)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 9 sn
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      # Ayni hesaptaki mcp-vet: bir MCP sunucusunun ne yapabildigini
      # kaynaktan cikariyor -- hangi kimlik bilgilerine dokunuyor, nereye
      # baglaniyor, ne calistiriyor. Kendi sunucumuzu kendi aracimizla
      # denetlemek, aracin da sunucunun da yanlis bulgusunu ortaya cikariyor:
      # bu is eklenirken mcp-vet'te gercek bir yanlis pozitif bulundu ve
      # duzeltildi (savunma amacli bir denylist, kimlik okumak sanilmisti).
      # Bilerek master izleniyor: aracin duzeltmeleri (yeni algilamalar, giderilen
      # yanlis pozitifler) bu kapiya bekletmeden yansisin. Ama `mcp-vet`in
      # `--version`u yok; hangi surumun karar verdigi kayda gecmezse kirmizi ya
      # da yesil bir kosu sonradan yeniden uretilemez. O yuzden master once tek
      # bir commit'e cozuluyor, tam o commit kuruluyor ve ozete yaziliyor.
      - name: mcp-vet'i kur
        run: |
          set -euo pipefail
          rev="$(git ls-remote https://github.com/Furkiozknn/mcp-vet refs/heads/master | cut -f1)"
          test -n "$rev" || { echo "mcp-vet master cozulemedi"; exit 1; }
          echo "MCPVET_REV=$rev" >> "$GITHUB_ENV"
          uv tool install "git+https://github.com/Furkiozknn/mcp-vet@$rev"
          echo "mcp-vet $rev kuruldu"

      # --offline: ag yok, yalnizca kaynak analizi. Depo zaten burada.
      - name: Denetle
        run: |
          # Actions bu kabugu `-e` ile calistiriyor. `... | tee` boru hatti
          # LOW bulguda 1 donuyor ve `-e` betigi tam orada olduruyor -- yani
          # asagidaki `case` hic kosmuyordu ve LOW bir sunucu kirmizi yaniyordu.
          # Cikis kodu `|| kod=$?` ile aliniyor, cunku `||` olan bir komut
          # `-e` icin sinanmis sayiliyor.
          set -uo pipefail
          kod=0
          mcp-vet audit --offline --path . > /tmp/mcpvet.txt 2>&1 || kod=$?
          cat /tmp/mcpvet.txt
          {
            echo '### mcp-vet'
            echo ''
            echo "Surum: Furkiozknn/mcp-vet@${MCPVET_REV}"
            echo ''
            echo '```'
            cat /tmp/mcpvet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 temiz, 1 LOW/MEDIUM, 2 HIGH, 3 CRITICAL, 4 arac kosamadi.
          # Kapi HIGH ve uzerinde kapaniyor: LOW/MEDIUM bulgular bu sunucuda
          # gercek ve bilinen yetenekleri anlatiyor (dis surec calistirmak
          # gibi), onlari kirmiziya cevirmek kapiyi anlamsizlastirirdi.
          # Aracin kendisi kosamadiysa (4) bu da bir arizadir, yesil degil.
          case "$kod" in
            0|1) echo "gecti (cikis $kod)" ;;
            *)   echo "mcp-vet cikis $kod"; exit 1 ;;
          esac
