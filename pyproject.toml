[project]
name = "nvidia-nim"
version = "0.1.0"
description = "NVIDIA NIM MCP server: image gen, translation, LLM, vision, content safety, embeddings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "litellm>=1.97.0",
    "mcp[cli]>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project is a single-file MCP server, not a Python package - without
# this, setuptools' flat-layout auto-discovery breaks the moment a second
# top-level directory exists (assets/, or output/ once generate_image or
# create_embedding has run once locally), since it can no longer tell which
# directory is "the package". Declaring the one real module explicitly skips
# that discovery entirely.
py-modules = ["nvidia_image"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
