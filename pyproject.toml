[project]
name = "nvidia-nim"
version = "0.1.0"
description = "NVIDIA NIM MCP server: image gen, translation, LLM, vision, content safety, embeddings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "litellm>=1.97.0",
    "mcp[cli]>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
