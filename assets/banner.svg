<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f1a08"/>
      <stop offset="60%" stop-color="#0a1206"/>
      <stop offset="100%" stop-color="#050a03"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6ff4d"/>
      <stop offset="55%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#c8ff8a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- node/fallback-chain motif -->
  <g stroke="#76b900" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#glow)">
    <line x1="90" y1="90" x2="220" y2="150"/>
    <line x1="220" y1="150" x2="90" y2="230"/>
    <line x1="220" y1="150" x2="330" y2="150"/>
  </g>
  <g fill="#a6ff4d" filter="url(#glow)">
    <circle cx="90" cy="90" r="7"/>
    <circle cx="90" cy="230" r="7"/>
    <circle cx="220" cy="150" r="9"/>
    <circle cx="330" cy="150" r="7"/>
  </g>
  <g stroke="#76b900" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#glow)">
    <line x1="1110" y1="90" x2="980" y2="150"/>
    <line x1="980" y1="150" x2="1110" y2="230"/>
    <line x1="980" y1="150" x2="870" y2="150"/>
  </g>
  <g fill="#a6ff4d" filter="url(#glow)">
    <circle cx="1110" cy="90" r="7"/>
    <circle cx="1110" cy="230" r="7"/>
    <circle cx="980" cy="150" r="9"/>
    <circle cx="870" cy="150" r="7"/>
  </g>

  <text x="600" y="155" text-anchor="middle" font-family="'Cascadia Code', 'Consolas', monospace" font-weight="700" font-size="60" fill="url(#title)" letter-spacing="1">nvidia-nim-mcp</text>

  <text x="600" y="197" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" fill="#d8f0c0" opacity="0.85">Free-tier NVIDIA NIM models for Claude Code — with automatic fallback</text>

  <text x="600" y="260" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" fill="#eafce0" opacity="0.95">🖼️ Image Gen &#160;&#160;&#160; 🌐 Translate &#160;&#160;&#160; 💬 LLM Chat &#160;&#160;&#160; 👁️ Vision &#160;&#160;&#160; 🛡️ Safety &#160;&#160;&#160; 🔗 Embeddings</text>
</svg>
